name: Tests

on:
  push:
    paths:
      - "Parkside.Api/**"
      - "Parkside.Tests/**"
      - "Parkside.sln"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Parkside.Api/**"
      - "Parkside.Tests/**"
      - "Parkside.sln"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet test Parkside.Tests
